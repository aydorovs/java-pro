spring:
  application:
    name: product-service
  datasource:
    url: jdbc:postgresql://localhost:5432/java_pro
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
server:
  port: 8080